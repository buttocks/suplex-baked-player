<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AcFun Wrestling Stream</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}#player{position:fixed;inset:0;width:100%;height:100%;display:block;border:0;background:#000}
#guidebtn{position:fixed;z-index:3;top:10px;right:10px;border:1px solid #ffffff45;border-radius:6px;padding:7px 10px;background:#111d;color:#fff;font:700 12px system-ui;cursor:pointer;opacity:.72}#guidebtn:hover,#guidebtn:focus-visible{opacity:1;outline:2px solid #edc16a;outline-offset:2px}
#guide{position:fixed;z-index:4;top:48px;right:10px;width:min(390px,calc(100vw - 20px));max-height:calc(100vh - 60px);overflow:hidden;border:1px solid #59414b;border-radius:9px;background:#17131aee;color:#f6f3f7;box-shadow:0 12px 40px #000b;font:13px/1.4 system-ui;display:none}
#guide.open{display:block}.guidehead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #ffffff20;color:#edc16a;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.guidehead button{border:0;background:none;color:#fff;font-size:18px;cursor:pointer}.guidebody{padding:10px 12px}.now{padding:0 0 10px;margin:0 0 5px;border-bottom:1px solid #ffffff20}.label{display:block;margin-bottom:3px;color:#fa4968;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.schedule{margin:0;padding:0;list-style:none}.schedule li{padding:8px 0;border-bottom:1px solid #ffffff16}.schedule li:last-child{border:0}.schedule .next{display:inline-block;min-width:54px;margin-right:6px;color:#fa7188;font-weight:800}.schedule small{display:block;margin:3px 0 0 60px;color:#aaa2ad}
</style>
</head>
<body>
<iframe id="player" title="AcFun wrestling video" scrolling="no" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<button id="guidebtn" type="button" aria-expanded="false" aria-controls="guide">TV Guide</button>
<aside id="guide" aria-label="Upcoming videos">
<header class="guidehead"><span>AcFun Wrestling Schedule</span><button type="button" id="close" aria-label="Close TV Guide">×</button></header>
<div class="guidebody"><p class="now"><span class="label">Now playing</span><span id="current"></span></p><span class="label">Coming next</span><ol class="schedule" id="schedule"></ol></div>
</aside>
<script>
(()=>{'use strict';
const videos=[
 {promotion:'NJPW',title:'NJPW World Tag League 2026 第四日 2026.11.27',id:'ac49029564'},
 {promotion:'AJPW',title:'AJPW 世界最強タッグ決定リーグ戦2026 第六日 2026.11.26',id:'ac49027973'},
 {promotion:'AEW',title:'AEW Collision #172 - Thanksgiving 2026.11.26',id:'ac49027922'},
 {promotion:'TNA',title:'TNA iMPACT #141 2026.11.26',id:'ac49027801'},
 {promotion:'AEW',title:'AEW Collision #172 2026.11.25 Bandido vs. 竹下幸之介',id:'ac49029607'}
];
const current=0;
document.getElementById('player').src='https://www.acfun.cn/player/'+videos[current].id+'?autoplay=true&mute=true&disablePlaylist=true';
document.getElementById('current').textContent=videos[current].promotion+' — '+videos[current].title;
const list=document.getElementById('schedule');
for(let offset=1;offset<videos.length;offset++){
 const v=videos[(current+offset)%videos.length],li=document.createElement('li');
 const time=document.createElement('span');time.className='next';time.textContent=offset===1?'Next':'Up next';
 const title=document.createElement('span');title.textContent=v.promotion+' — '+v.title;
 const note=document.createElement('small');note.textContent='After the current video';
 li.append(time,title,note);list.append(li);
}
const guide=document.getElementById('guide'),button=document.getElementById('guidebtn');
function toggle(open){guide.classList.toggle('open',open);button.setAttribute('aria-expanded',String(open));}
button.addEventListener('click',()=>toggle(!guide.classList.contains('open')));
document.getElementById('close').addEventListener('click',()=>toggle(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false);});
})();
</script>
</body>
</html>
