name: Stage-check dynamic SlamVision catalog in Chromium
on:
  workflow_dispatch:
  push:
    branches:
      - automation/slamvision-six-hour-lineup
    paths:
      - .github/workflows/verify-slamvision-auto-catalog.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify live-style catalog filters, counts and links
        run: |
          python -m http.server 8755 --bind 127.0.0.1 >/tmp/catalog-http.log 2>&1 &
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  page=await b.new_page()
                  errors=[]
                  page.on('pageerror', lambda err: errors.append(str(err)))
                  await page.goto('http://127.0.0.1:8755/research/slamvision-tube-catalog.html',wait_until='domcontentloaded',timeout=20000)
                  await page.wait_for_function("() => document.getElementById('shown').textContent.includes('116 matching feeds')",timeout=12000)
                  assert await page.locator('.card').count()==116
                  assert await page.get_by_role('button',name='Copy iframe').count()==116
                  assert await page.locator('#summary').inner_text()
                  assert 'Last catalog update:' in (await page.locator('#catalog-notice').inner_text())
                  await page.select_option('#tube','NJPW Tube')
                  await page.wait_for_function("() => document.getElementById('shown').textContent.includes('8 matching feeds')",timeout=6000)
                  assert await page.locator('.card').count()==8
                  await page.select_option('#ready','shared')
                  assert await page.locator('.card').count()==7
                  await page.select_option('#ready','')
                  await page.fill('#query','G1 Climax')
                  assert await page.locator('.card').count()==1
                  await page.fill('#query','')
                  await page.select_option('#tube','Joshi Tube')
                  assert await page.locator('.card').count()==5
                  assert not errors, errors
                  print('PASS: all 116 iframe cards, tube/player/search filters, dynamic counts and change summary',flush=True)
                  await b.close()
          asyncio.run(main())
          PY
