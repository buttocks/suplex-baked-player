name: Test SlamVision stable-ID rotation
on:
  workflow_dispatch:
  push:
    branches:
      - fix/slamvision-stable-id-rotation
    paths:
      - scripts/sync_slamvision.py
      - scripts/test_slamvision_rotation.py
      - .github/workflows/test-slamvision-rotation.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m py_compile scripts/sync_slamvision.py
      - name: Test channel-ID rotation, stale dial mappings, and feed safety
        run: python scripts/test_slamvision_rotation.py
      - name: Refresh live schedules without publishing any files
        run: |
          python scripts/sync_slamvision.py
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          total=0
          for p in sorted(Path('slamvision').glob('*-live.json')):
              j=json.loads(p.read_text())
              total+=len(j['channels'])
              for dial, c in j['channels'].items():
                  if c['id'] not in ('njpw','wwf-90-00'): continue
                  now=datetime.now(timezone.utc)
                  print('VERIFIED',dial,'ID',c['id'],'TITLE',c['current']['title'],flush=True)
          print('SCHEDULES',total,flush=True)
          PY
