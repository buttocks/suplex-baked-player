name: Stage-test universal SlamVision schedule backup
on:
  workflow_dispatch:
  push:
    branches:
      - fix/slamvision-universal-shared-cache
    paths:
      - .github/workflows/test-shared-slamvision-cache.yml
      - scripts/sync_slamvision.py
      - scripts/publish_slamvision.py
      - scripts/test_slamvision_coverage.py
      - scripts/test_slamvision_shared_cache.cjs
      - slamvision-feed.html
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test complete catalog coverage, safe routing and legacy behavior
        run: |
          python -m py_compile scripts/sync_slamvision.py scripts/publish_slamvision.py
          python scripts/test_slamvision_coverage.py
          python scripts/test_slamvision_rotation.py
          node scripts/test_slamvision_shared_cache.cjs
          node scripts/test_slamvision_njpw_cache.cjs
          node scripts/test_slamvision_puro_cache.cjs
          node scripts/test_slamvision_direct.cjs
          node scripts/test_slamvision_all_embeds.cjs
          python scripts/publish_slamvision.py --self-test
      - name: Download real schedule snapshots for all active shared feeds
        run: |
          python scripts/sync_slamvision.py
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          from scripts import sync_slamvision as mod
          paths=[p for p in Path('slamvision').glob('*-live.json')]
          assert len(paths)>=15,'shared group not generated'
          data=json.loads(Path('slamvision/shared-live.json').read_text())
          expected=set(mod.shared_feed_ids())
          covered=set(data['channels'])
          missing=sorted(expected-covered)
          now=datetime.now(timezone.utc).timestamp()
          print('SHARED_LIVE_TOTAL',len(covered),'OF',len(expected),flush=True)
          for id in missing: print('SHARED_MISSING',id,flush=True)
          for id,entry in data['channels'].items():
              assert entry['id']==id,(id,entry['id'])
              slots=[entry.get('current'),*(entry.get('up_next') or [])]
              active=[slot for slot in slots if slot and slot.get('stream_url','').startswith('https://archive.org/') and
                mod.parse_time(slot.get('start')) is not None and mod.parse_time(slot.get('end')) is not None and
                mod.parse_time(slot['start'])<=now<mod.parse_time(slot['end'])]
              if not active: raise AssertionError('No current slot: '+id)
          assert len(covered)>=int(len(expected)*.90),'Too many missing live shared schedules; refuse deployment'
          print('PASS: live shared backup has exact IDs and currently playable slots across',len(covered),'feeds',flush=True)
          PY
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check representative public iframe paths with upstream API blocked
        run: |
          python -m http.server 8755 --bind 127.0.0.1 >/tmp/shared-http.log 2>&1 &
          python - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          ids=['ajpw-carnival','619','marigold','wwf-heat','wcw-mn',
               'ecw-hardcoretv','aew-tv','roh-wrestling','ddt-pro',
               'jcw','bsn','awa','year-1985']
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--autoplay-policy=no-user-gesture-required'])
                  sem=asyncio.Semaphore(5)
                  async def test(id):
                      async with sem:
                          page=await browser.new_page()
                          await page.route('https://ring-channel-tv.emergent.host/api/**',lambda route:route.abort('failed'))
                          await page.goto('http://127.0.0.1:8755/slamvision-feed.html?id='+id,wait_until='domcontentloaded',timeout=22000)
                          try:
                              await page.wait_for_function("() => (document.querySelector('video')?.currentSrc||'').startsWith('https://archive.org/')",timeout=10000)
                              state=await page.evaluate("""() => ({src:document.querySelector('video')?.currentSrc,
                                 guide:document.getElementById('guide-title')?.textContent})""")
                              print('TEST_OFFLINE',id,json.dumps(state),flush=True)
                              assert id.replace('-',' ').split()[0].lower() in state['guide'].lower() or state['guide']
                          finally:await page.close()
                  await asyncio.gather(*(test(id) for id in ids))
                  await browser.close()
                  print('PASS: all 13 sampled tube categories tune locally with upstream API blocked',flush=True)
          asyncio.run(main())
          PY