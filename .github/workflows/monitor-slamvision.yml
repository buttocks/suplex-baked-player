name: Monitor SlamVision published schedules

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  push:
    branches:
      - main
      - monitor/slamvision-schedule-health
      - fix/slamvision-schedule-and-single-alert
      - monitor/all-active-slamvision-125
    paths:
      - .github/workflows/monitor-slamvision.yml
      - scripts/monitor_slamvision.py
      - research/slamvision-current.json

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: slamvision-schedule-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify monitor rules offline
        run: python scripts/monitor_slamvision.py --self-test
      - name: Check actual published GitHub Pages schedules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            python scripts/monitor_slamvision.py --alert
          else
            python scripts/monitor_slamvision.py --dry-run
          fi
