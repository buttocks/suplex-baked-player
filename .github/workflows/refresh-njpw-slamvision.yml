name: Refresh SlamVision wrestling channels
on:
  workflow_dispatch:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-njpw-slamvision.yml'
      - 'scripts/sync_slamvision.py'
      - 'scripts/test_slamvision_rotation.py'
      - 'scripts/test_slamvision_njpw_cache.cjs'
      - 'scripts/test_slamvision_puro_cache.cjs'
      - 'scripts/test_slamvision_coverage.py'
      - 'scripts/test_slamvision_shared_cache.cjs'
      - 'research/slamvision-current.json'
      - 'slamvision-direct-fallback.js'
      - 'slamvision-feed.html'
      - 'scripts/publish_slamvision.py'
permissions:
  contents: write
concurrency:
  group: slamvision-njpw-schedule
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify stable-ID rotation safeguards
        run: python scripts/test_slamvision_rotation.py
      - name: Verify NJPW backup feed safety
        run: node scripts/test_slamvision_njpw_cache.cjs
      - name: Verify Puro backup feed safety
        run: node scripts/test_slamvision_puro_cache.cjs
      - name: Verify coverage for all catalog players and shared-cache safety
        run: |
          python scripts/test_slamvision_coverage.py
          node scripts/test_slamvision_shared_cache.cjs
      - name: Fetch live wrestling channel data
        run: python scripts/sync_slamvision.py
      - name: Test safe snapshot publisher
        run: python scripts/publish_slamvision.py --self-test
      - name: Publish fresh snapshots safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_slamvision.py
