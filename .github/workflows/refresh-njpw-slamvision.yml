name: Refresh SlamVision Baked channel schedules
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/refresh-njpw-slamvision.yml'
      - 'scripts/sync_slamvision.py'
permissions:
  contents: write
concurrency:
  group: slamvision-njpw-schedule
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch live wrestling channel data
        run: python scripts/sync_slamvision.py
      - name: Publish schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slamvision/njpw-live.json slamvision/ajpw-live.json slamvision/channel-100-live.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SlamVision NJPW stream data"
            git pull --rebase origin main
            git push
          fi
