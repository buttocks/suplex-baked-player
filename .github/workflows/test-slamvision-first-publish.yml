name: Test new SlamVision JSON first publish
on:
  workflow_dispatch:
  push:
    branches:
      - fix/slamvision-first-publish-untracked-cache
    paths:
      - .github/workflows/test-slamvision-first-publish.yml
      - scripts/publish_slamvision.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate new untracked file publication on local Git fixture
        run: |
          python -m py_compile scripts/publish_slamvision.py
          python scripts/publish_slamvision.py --self-test
      - name: Verify 15th shared snapshot is on the actual publish manifest
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from publish_slamvision import FILES
          assert len(FILES)==15
          assert FILES[-1]=='slamvision/shared-live.json'
          print('PASS: publisher includes 15 original and shared schedules',len(FILES),flush=True)
          PY
