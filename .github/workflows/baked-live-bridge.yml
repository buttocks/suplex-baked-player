name: Baked.live iframe management bridge

on:
  push:
    branches: [main]
    paths:
      # Changing this file is the only automatic command trigger.
      - baked-bridge/request.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baked-live-iframe-bridge
  cancel-in-progress: false

jobs:
  update-iframe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BAKED_LIVE_PASSWORD: ${{ secrets.BAKED_LIVE_PASSWORD }}
      BAKED_BRIDGE_REQUEST: baked-bridge/request.json
    steps:
      - name: Check out reviewed commands
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate bridge code and command
        run: |
          node --check baked-bridge/bridge.mjs
          node --check baked-bridge/skin-backup.mjs
          node --check baked-bridge/skin-apply.mjs
          node --check baked-bridge/motd-cleanup.mjs
          node --check baked-bridge/emote-cleanup.mjs
          node --check baked-bridge/playlist-audit.mjs
          node --input-type=module -e "import {isImgurRemovedPlaceholder as f} from './baked-bridge/emote-cleanup.mjs'; if (!f('https://i.imgur.com/removed.png') || !f('https://i.imgur.com/removed.png?token=1') || f('https://i.imgur.com/valid.png') || f('https://other.example/removed.png')) process.exit(1);"
          node baked-bridge/bridge.mjs --self-test
          test -f baked-bridge/request.json || { echo 'No bridge request: contact maintainer to create it.'; exit 1; }

      - name: Check Baked.live account secret
        run: |
          if [ -z "$BAKED_LIVE_PASSWORD" ]; then
            echo 'Configure repository secret BAKED_LIVE_PASSWORD first. See baked-bridge/README.md.'
            exit 1
          fi

      - name: Install pinned browser automation
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Audit or update authorized channel iframe
        run: node baked-bridge/bridge.mjs

      - name: Attach action result (without credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baked-live-bridge-result
          path: |
            baked-bridge/result.json
            baked-bridge/skin-css-backup.css
            baked-bridge/skin-preview.png
            baked-bridge/motd-before-cleanup.html
            baked-bridge/motd-after-cleanup.html
            baked-bridge/skin-before-deploy.css
            baked-bridge/skin-after-deploy.css
            baked-bridge/luchatube-arena-poster-preview.png
            baked-bridge/legacy-emote-cleanup.json
            baked-bridge/emotes-before-legacy-cleanup.json
            baked-bridge/backup/
            baked-bridge/emote-url-audit.json
            baked-bridge/playlist-media-audit.json
            baked-bridge/playlist-before-cleanup.json
            baked-bridge/emote-url-cleanup.json
            baked-bridge/emotes-before-cleanup.json
          if-no-files-found: ignore
          retention-days: 7
