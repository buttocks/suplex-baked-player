name: Stage-test SlamVision rotation report
on:
  workflow_dispatch:
  push:
    branches: [feature/slamvision-rotation-history]
    paths:
      - .github/workflows/test-slamvision-rotation-report.yml
      - research/slamvision-rotation-report.html
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check report JavaScript syntax and history raw URL
        run: |
          python - <<'PY'
          import pathlib, subprocess, urllib.request, json
          page=pathlib.Path('research/slamvision-rotation-report.html').read_text()
          js=page.split('<script>',1)[1].split('</script>',1)[0]
          subprocess.run(['node','--check','-'],input=js,text=True,check=True)
          base='https://raw.githubusercontent.com/buttocks/suplex-baked-player/tracking/slamvision-history/tracking-state/'
          for name in ('state.json','events.json'):
              req=urllib.request.Request(base+name,headers={'Origin':'https://buttocks.github.io','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  d=json.load(r)
                  print('RAW_HISTORY',name,'status',r.status,'ACAO',r.headers.get('Access-Control-Allow-Origin'),'size',len(str(d)),flush=True)
                  assert r.status==200 and r.headers.get('Access-Control-Allow-Origin') in ('*','https://buttocks.github.io')
          print('PASS: static rotation report syntax and browser-accessible independent history',flush=True)
          PY
      - name: Install headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify Eastern-time report renders historic baseline and live mapping
        run: |
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/rotation-http.log 2>&1 &
          python - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  page=await browser.new_page()
                  errs=[]
                  page.on('pageerror',lambda e:errs.append(str(e)))
                  page.on('requestfailed',lambda q:errs.append(q.url+' '+str(q.failure)) if 'raw.githubusercontent.com' in q.url else None)
                  await page.goto('http://127.0.0.1:8766/research/slamvision-rotation-report.html',wait_until='domcontentloaded',timeout=20000)
                  await page.wait_for_function("() => document.getElementById('loading').textContent.startsWith('Last successful check:')",timeout=18000)
                  rows=await page.locator('#map-rows tr').count()
                  text=await page.locator('#loading').inner_text()
                  assert rows>=100,rows
                  await page.fill('#map-filter','njpw')
                  assert await page.locator('#map-rows tr').count()>=1
                  await page.fill('#map-filter','')
                  assert not errs,errs
                  print('PASS: rotation report loaded',rows,'upstream mappings from separate history branch',flush=True)
                  print('REPORT_TIMESTAMP',text[:500],flush=True)
                  await browser.close()
          asyncio.run(main())
          PY
