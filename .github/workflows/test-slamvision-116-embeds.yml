name: Test all 116 SlamVision embed pages
on:
  workflow_dispatch:
  push:
    branches:
      - feature/slamvision-all-116-embeds
    paths:
      - .github/workflows/test-slamvision-116-embeds.yml
      - slamvision-feed.html
      - slamvision-direct-fallback.js
      - research/slamvision-tube-catalog.html
      - research/slamvision-by-tube-2026-11-17.json
      - research/slamvision-by-tube-2026-11-17.csv
      - research/slamvision-iframes-by-tube.txt
      - scripts/test_slamvision_all_embeds.cjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all stable IDs and iframe links, including live-only playback
        run: node scripts/test_slamvision_all_embeds.cjs
      - name: Regression test existing 24 player schedules
        run: node scripts/test_slamvision_direct.cjs
      - name: Verify catalog JavaScript and generic player script
        run: |
          python - <<'PY'
          import pathlib,subprocess
          for name in ('research/slamvision-tube-catalog.html','slamvision-feed.html'):
              s=pathlib.Path(name).read_text()
              assert s.count('<script>')==1
              js=s.split('<script>',1)[1].split('</script>',1)[0]
              subprocess.run(['node','--check','-'],input=js,text=True,check=True)
          print('PASS: HTML embedded JavaScript syntax and parent catalog')
          PY
      - name: Test selected live upstream feeds remain accessible
        run: |
          python - <<'PY'
          import urllib.request,json
          for id in ('njpw-g1climax','wcw-mn','year-1985','tjpw-tv'):
              url='https://ring-channel-tv.emergent.host/api/channels/'+id+'/now'
              req=urllib.request.Request(url,headers={'Origin':'https://buttocks.github.io','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  obj=json.load(r)
                  assert obj['channel']['id']==id
                  assert r.headers.get('Access-Control-Allow-Origin') in ('*','https://buttocks.github.io')
                  assert (obj.get('current') or {}).get('program',{}).get('stream_url','').startswith('https://archive.org/')
                  print('PASS: API feed',id,'real dial',obj['channel'].get('number'),flush=True)
          PY
