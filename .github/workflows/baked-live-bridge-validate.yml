name: Validate Baked.live bridge code

on:
  push:
    branches: [main]
    paths:
      - baked-bridge/bridge.mjs
      - baked-bridge/skin-backup.mjs
      - .github/workflows/baked-live-bridge.yml
      - .github/workflows/baked-live-bridge-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and safety tests (no credentials)
        run: |
          node --check baked-bridge/bridge.mjs
          node --check baked-bridge/skin-backup.mjs
          node baked-bridge/bridge.mjs --self-test
