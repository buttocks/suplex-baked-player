name: Test browser-aware SlamVision monitor
on:
  workflow_dispatch:
  push:
    branches:
      - fix/slamvision-health-aware-live-fallback
    paths:
      - .github/workflows/test-slamvision-monitor-hybrid.yml
      - scripts/monitor_slamvision.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate monitor Python syntax
        run: python -m py_compile scripts/monitor_slamvision.py
      - name: Run baseline and browser fallback health test scenarios
        run: python scripts/monitor_slamvision.py --self-test
      - name: Check actual published player availability through both sources
        run: python scripts/monitor_slamvision.py --dry-run
