name: Inspect SlamVision integration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-slamvision.yml'
      - 'scripts/inspect_slamvision.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public site
        run: python scripts/inspect_slamvision.py
      - name: Save diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slamvision-inspect.json
          git diff --cached --quiet || (git commit -m "Record SlamVision public player integration details" && git push)
